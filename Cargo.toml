[package]
name = "chunky"
version = "0.1.0"
edition = "2021"
authors = ["Chunky"]
description = "3D model to Minecraft structure converter"

[[bin]]
name = "chunky"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", features = ["wgpu", "default_fonts"] }
egui = "0.28"
egui-wgpu = "0.28"
wgpu = "0.20"
glam = { version = "0.28", features = ["bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }
tobj = "4.0"
gltf = "1.4"
rayon = "1.10"
flate2 = "1.0"
byteorder = "1.5"
rfd = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1
